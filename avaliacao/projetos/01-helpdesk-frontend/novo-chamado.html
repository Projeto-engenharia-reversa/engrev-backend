<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrir chamado</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topo">
    <h1>Central de Chamados</h1>
    <nav>
      <a href="chamados.html">Chamados</a>
      <a href="novo-chamado.html" class="ativo">Abrir chamado</a>
      <a href="cliente.html">Clientes</a>
      <a href="relatorio.html">Relat&oacute;rios</a>
    </nav>
  </header>

  <main class="conteudo">
    <h2>Abertura de chamado</h2>

    <form action="/chamados" method="post" id="form-chamado">
      <!-- Campo tecnico da sessao corrente, preenchido pelo app.js no carregamento -->
      <input type="hidden" name="session_id" id="session_id">

      <div class="linha">
        <div class="campo">
          <label for="titulo">T&iacute;tulo</label>
          <input type="text" id="titulo" name="titulo" maxlength="120" required>
        </div>

        <div class="campo">
          <label for="protocolo">Protocolo</label>
          <input type="text" id="protocolo" name="protocolo" readonly>
        </div>
      </div>

      <div class="campo">
        <label for="descricao">Descri&ccedil;&atilde;o do problema</label>
        <textarea id="descricao" name="descricao" rows="6" required></textarea>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="cliente_id">Cliente</label>
          <select id="cliente_id" name="cliente_id" required>
            <option value="">Selecione...</option>
          </select>
        </div>

        <div class="campo">
          <label for="categoria_id">Categoria</label>
          <select id="categoria_id" name="categoria_id" required>
            <option value="">Selecione...</option>
          </select>
        </div>

        <div class="campo">
          <label for="tecnico_id">T&eacute;cnico respons&aacute;vel</label>
          <select id="tecnico_id" name="tecnico_id">
            <option value="">N&atilde;o atribu&iacute;do</option>
          </select>
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="prioridade">Prioridade</label>
          <select id="prioridade" name="prioridade">
            <option value="baixa">Baixa</option>
            <option value="media" selected>M&eacute;dia</option>
            <option value="alta">Alta</option>
            <option value="critica">Cr&iacute;tica</option>
          </select>
        </div>

        <div class="campo">
          <label for="prazo_limite">Prazo limite</label>
          <input type="date" id="prazo_limite" name="prazo_limite">
        </div>

        <div class="campo">
          <label for="horas_estimadas">Horas estimadas</label>
          <input type="number" id="horas_estimadas" name="horas_estimadas" min="0" step="0.5">
        </div>
      </div>

      <label class="inline">
        <input type="checkbox" name="reincidente"> Chamado reincidente
      </label>

      <div class="acoes">
        <button type="submit">Abrir chamado</button>
        <a href="chamados.html" class="botao-secundario">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="js/models.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.prepararFormularioChamado();
  </script>
</body>
</html>
