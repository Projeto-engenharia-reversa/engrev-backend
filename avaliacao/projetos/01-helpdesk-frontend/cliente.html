<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de cliente</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topo">
    <h1>Central de Chamados</h1>
    <nav>
      <a href="chamados.html">Chamados</a>
      <a href="novo-chamado.html">Abrir chamado</a>
      <a href="cliente.html" class="ativo">Clientes</a>
      <a href="relatorio.html">Relat&oacute;rios</a>
    </nav>
  </header>

  <main class="conteudo">
    <h2>Cadastro de cliente</h2>

    <form action="/clientes" method="post" id="form-cliente">
      <div class="linha">
        <div class="campo">
          <label for="razao_social">Raz&atilde;o social</label>
          <input type="text" id="razao_social" name="razao_social" required maxlength="180">
        </div>

        <div class="campo">
          <label for="nome_fantasia">Nome fantasia</label>
          <input type="text" id="nome_fantasia" name="nome_fantasia" maxlength="120">
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="cnpj">CNPJ</label>
          <input type="text" id="cnpj" name="cnpj" maxlength="18" required>
        </div>

        <div class="campo">
          <label for="email_contato">E-mail de contato</label>
          <input type="email" id="email_contato" name="email_contato" required>
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone">
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade">
        </div>

        <div class="campo">
          <label for="uf">UF</label>
          <select id="uf" name="uf">
            <option value="SP">SP</option>
            <option value="RJ">RJ</option>
            <option value="MG">MG</option>
            <option value="RS">RS</option>
            <option value="PR">PR</option>
          </select>
        </div>

        <div class="campo">
          <label for="cliente_desde">Cliente desde</label>
          <input type="date" id="cliente_desde" name="cliente_desde">
        </div>
      </div>

      <div class="campo">
        <label for="observacoes">Observa&ccedil;&otilde;es</label>
        <textarea id="observacoes" name="observacoes" rows="4"></textarea>
      </div>

      <label class="inline">
        <input type="checkbox" name="contrato_ativo" checked> Contrato de suporte ativo
      </label>

      <div class="acoes">
        <button type="submit">Salvar cliente</button>
      </div>
    </form>

    <section class="lista">
      <h3>Clientes cadastrados</h3>
      <table id="tabela-clientes">
        <thead>
          <tr>
            <th>Raz&atilde;o social</th>
            <th>CNPJ</th>
            <th>Cidade</th>
            <th>Contrato</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="js/models.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.listarClientes();
  </script>
</body>
</html>
