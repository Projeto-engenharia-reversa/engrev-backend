<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Chamados - Acesso</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="tela-login">
  <main class="caixa-login">
    <h1>Central de Chamados</h1>
    <p class="subtitulo">Suporte interno &mdash; acesso restrito</p>

    <form action="/tecnicos/login" method="post" id="form-login">
      <label for="email">E-mail corporativo</label>
      <input type="email" id="email" name="email" required placeholder="nome@empresa.com.br">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>

      <label class="lembrar">
        <input type="checkbox" name="lembrar_acesso"> Manter conectado neste computador
      </label>

      <button type="submit">Entrar</button>
    </form>

    <p class="rodape-login">
      Esqueceu a senha? Procure o administrador do sistema no ramal 4102.
    </p>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', function (evento) {
      evento.preventDefault();
      App.autenticar(this.email.value, this.senha.value);
    });
  </script>
</body>
</html>
