# Configuracao do servico de biblioteca.
# Os valores de producao vem por variavel de ambiente no deploy.

spring.application.name=biblioteca
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca
spring.datasource.username=${DB_USER:biblioteca}
spring.datasource.password=${DB_PASSWORD:biblioteca}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25

# Regras de negocio do emprestimo
biblioteca.emprestimo.multa-por-dia=1.50
biblioteca.emprestimo.renovacoes-maximas=2
biblioteca.emprestimo.dias-aviso-vencimento=3

logging.level.com.biblioteca=INFO
logging.level.org.hibernate.SQL=WARN
