# O serviço frontend compila ../engrev-frontend. Clone os dois repositórios no
# mesmo diretório. Instruções no README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: engrev
      POSTGRES_PASSWORD: engrev
      POSTGRES_DB: engrev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engrev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://engrev:engrev@db/engrev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  frontend:
    build: ../engrev-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
